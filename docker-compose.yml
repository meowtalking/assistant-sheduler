services:
  backend:
    build:
      context: ./backend  # Путь до папки backend относительно корня проекта
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=assistantsheduler
      - DB_USER=assistant_user
      - DB_PASSWORD=meowing
      - SQLALCHEMY_DATABASE_URL=mysql://assistant_user:meowing@mysql:3306/assistantsheduler
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: assistantsheduler
      MYSQL_USER: assistant_user
      MYSQL_PASSWORD: meowing
    ports:
      - "3308:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "assistant_user", "-pmeowing" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
networks:
  your_network:
    driver: bridge
